<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VoiceAIThing dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    a { color: #06c; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { color: #555; font-weight: 600; }
    tr.call-row { cursor: pointer; }
    tr.call-row:hover { background: #f5f5f5; }
    .status { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .status-completed { background: #dcfce7; color: #166534; }
    .status-in_progress { background: #fef9c3; color: #854d0e; }
    .status-initiated { background: #e5e7eb; color: #374151; }
    .status-incomplete, .status-failed { background: #fee2e2; color: #991b1b; }
    #detail { margin-top: 24px; padding-top: 16px; border-top: 2px solid #eee; }
    .transcript-line { margin: 4px 0; }
    .transcript-line.ai { color: #1d4ed8; }
    .transcript-line.patient { color: #111; }
    .flag { color: #b91c1c; font-weight: 600; }
    #backLink { display: none; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Call review dashboard</h1>
  <p>Internal QA view of completed calls -- transcripts and structured answers. Not the
     doctor-facing unified clinical report (that lives on the gait checker's own portal).
     <a href="/">&larr; back to start a call</a></p>

  <div id="listView">
    <table id="callsTable">
      <thead>
        <tr><th>Started</th><th>Patient</th><th>Condition</th><th>Status</th></tr>
      </thead>
      <tbody id="callsBody"></tbody>
    </table>
  </div>

  <div id="detail" style="display: none;">
    <a href="#" id="backLink">&larr; back to call list</a>
    <div id="detailContent"></div>
  </div>

  <script type="module" src="/dashboard.js"></script>
</body>
</html>
